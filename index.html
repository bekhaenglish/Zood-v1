                    const r = await window.storage.get(key);
                    if (alive && r && r.value != null)

            catch (e) { }

    }, []);
    useEffect(() => {
        if (!loaded.current)
            return;

            if (typeof window !== "undefined" && window.storage)

        }
        catch (e) { } })();
    }, [val]);
    return [val, setVal];
}
